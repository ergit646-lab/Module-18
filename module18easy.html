<!DOCTYPE html>
<html>
<head>
  <title>2D Transforms</title>
  <style>
    .box {
      width: 150px;
      height: 150px;
      background-color: blue;
      color: white;
      margin: 100px auto;
      text-align: center;
      line-height: 150px;
      

      transition: transform 0.5s;
    }

    
    .box:hover {
     
      transform: scale(1.2) rotate(15deg);
    }
  </style>
</head>
<body>

  <div class="box"></div>

</body>
</html>
